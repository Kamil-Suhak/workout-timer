name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Create Release
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run test suite
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Stage Release Artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk workout-timer-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Workout Timer ${{ github.ref_name }}
          files: workout-timer-${{ github.ref_name }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false
